{% extends "base.html" %}
{% block title %}ورود{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0 rounded-4 p-4">
      <h3 class="fw-bold mb-3">ورود به حساب</h3>

      {% if form.errors %}
        <div class="alert alert-danger">نام کاربری یا رمز عبور اشتباه است.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">نام کاربری</label>
          {{ form.username }}
        </div>

        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          {{ form.password }}
        </div>

        <button class="btn btn-dark w-100" type="submit">ورود</button>
      </form>

      <div class="mt-3 text-center">
        حساب ندارید؟
        <a href="{% url 'register' %}">ثبت‌نام</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
