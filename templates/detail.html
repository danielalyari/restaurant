{% extends 'base.html' %}
{% block title %}Detail{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-5">
    {% if object.image %}
      <img class="img-fluid rounded" src="{{ object.image.url }}" alt="{{ object.name }}">
    {% endif %}
  </div>
  <div class="col-md-7">
    <h3>{{ object.name }}</h3>
    <p class="text-muted">{{ object.description }}</p>
    <p>مواد: {{ object.ingredients }}</p>
    <p>قیمت: <b>{{ object.price }}</b> تومان</p>

    <a class="btn btn-success" href="{% url 'order' object.pk %}">ثبت سفارش</a>
  </div>
</div>
{% endblock %}
